name: Refresh public event radar

on:
  schedule:
    # 10:20 Asia/Taipei. Event listings change more slowly than movie sessions,
    # so one independent public refresh per day is sufficient.
    - cron: '20 2 * * *'
  workflow_dispatch:

concurrency:
  group: event-radar-pages
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore the previous public event database
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/events.db
          key: event-radar-data-${{ github.run_id }}
          restore-keys: |
            event-radar-data-

      - name: Install deterministic build dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check requests pyyaml
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Refresh public sources
        env:
          PYTHONPATH: code
        run: .venv/bin/python -m event_radar.pipeline

      - name: Unit tests
        env:
          PYTHONPATH: code
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build and check public snapshot
        run: |
          npm run build
          npm run check

      - name: Browser smoke test
        run: npm run smoke

      - name: Save event data for the next refresh
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/events.db
          key: event-radar-data-${{ github.run_id }}

      - name: Package GitHub Pages artifact
        run: |
          tar --dereference --hard-dereference --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
