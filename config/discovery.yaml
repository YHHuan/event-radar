    note: 火獅巡境與臨時行程異動；粉專目前人工追蹤。
  - id: puppets
    name: 雲林國際偶戲節官方粉專
    mode: manual
    url: https://www.facebook.com/puppet.yunlin.gov.tw/
    lenses: [folk]
    note: 布袋戲、掌中劇與各地演出時間表；粉專目前人工追蹤。
  - id: taiwan-music
    name: 台灣祭官方窗口
    mode: manual
    url: https://www.amazing-pingtung.com/tmf
    lenses: [music_festival]
    note: 屏東免費音樂祭的卡司與新一屆公告；不沿用往年日期。
  - id: takaorock
    name: 打狗祭官方網站
    mode: manual
    url: https://www.takaorock.tw/
    lenses: [music_festival]
    note: 免費舞台、系列節目與場域地圖；售票節目另由高流來源每日更新。
  - id: festival-index
    name: PartyStar 台灣看團潮
    mode: manual
    url: https://partystar.media/fest
    lenses: [music_festival]
    note: 音樂祭媒體索引用來補漏，日期仍回查主辦公告。
  - id: runners
    name: 跑者廣場全國賽會
    mode: manual
    url: https://www.taipeimarathon.org.tw/contest.aspx
    lenses: [endurance]
    note: 全台賽事索引，含環島與特殊挑戰；目前列為人工補漏窗口。
