# Event Radar — 個人化品味設定 (Salmon)
# 改這份 = 改系統靈魂。rules.py 與 Claude 打分都讀這裡。

horizon_days: 90

regions:
  primary: ["台北市", "台北", "臺北市", "新北市", "新北"]
  secondary: ["基隆市", "基隆", "桃園市", "桃園"]

age_context: "20s"
# 註:會為了夠好的演出跨縣市(已購票《COMPANY》在臺中)→ 他縣市只 demote 不 drop。
discovery_style:
  - independent       # 獨立
  - niche             # 小眾
  - live              # 現場感
  - participatory     # 參與式
  - arts_culture      # 藝文
  - social_practice   # 社區/社會議題
  - urban_experience  # 城市體驗/街遊導覽
  - nature_experience # 夜間生態/自然沉浸
  - food_experience   # 料理/異國/吃到飽
  - subculture        # 機車改裝/工藝/偶像/curiosity 展
  - folk_culture      # 民俗/祭典/紙紮
  - jazz_music        # 爵士

# ── 加分權重(rules.py 用,可調) ──
weights:
  source_whitelist: 15      # 命中白名單場館/主辦/常看平台
  strong_keyword: 12
  medium_keyword: 5
  niche_indie: 8            # 小型場館/學生製作/獨立主辦/實驗
  participatory_live: 8     # 真人圖書館/實境/沉浸/工作坊/料理/走讀
  utility: 6                # 90天內 + 地區 + 週五晚/週末 + 資訊完整 + 票價合理
  noise_penalty: -40        # 命中垃圾訊號

