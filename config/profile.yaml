# 命中即重扣 / 視為垃圾
negative_keywords:
  - 投資
  - 保險
  - 房地產
  - 房產
  - 直銷
  - 招商
  - 加盟
  - 創業說明會
  - 企業培訓
  - 企業內訓
  - 行銷課
  - 理財
  - 被動收入
  - 財富自由
  - 月入
  - 翻轉人生
  - 成功學
  - 名師
  - AI賺錢
  - 副業
  - 流量變現
  - 個人品牌
  - 免費說明會
  - 免費體驗
  - 身心靈
  - 水晶
  - 塔羅課程
  - 能量療癒
  - 親子          # 預設降權,可在 toggles 開
  - 兒童
  - 純線上
  - 線上課程

# 硬垃圾:詐騙/MLM/金融招募類。protect_keywords 也救不了(永遠扣分+drop)。
# 註:房地產/房產 刻意「不」放這裡 — Salmon 收藏過台灣國際房地產博覽會。
#     博覽會/大展 是他愛逛的 curiosity,所以 房地產 只當軟垃圾(demote 可救),
#     真正詐騙味的字(投資/被動收入/財富自由/免費說明會)才硬擋。
hard_negative_keywords:
  - 投資
  - 保險
  - 直銷
  - 招商
  - 加盟
  - 創業說明會
  - 企業培訓
  - 企業內訓
  - 理財
  - 被動收入
  - 財富自由
  - 月入
  - 翻轉人生
  - 成功學
  - AI賺錢
  - 副業
  - 流量變現
  - 免費說明會

# 不誤殺:這些含「工作坊/講座」也要保留,交給 Claude 評(只擋『軟』負向如親子/線上)
protect_keywords:
  - 真人圖書館
  - 社區實踐
  - 藝術家座談
  - 劇場工作坊
  - 料理體驗
  - 即興喜劇
  - 城市走讀
  - 讀劇

toggles:
  include_kids: false        # 開了就不扣親子
  include_online: false      # 開了就不扣純線上
  weekend_bonus: true        # 週五晚/週末加分

# ── 信用卡 presale(售票頁「【Mastercard專區】」「玉山卡友專區」會被標 💳<卡>)──
# mine = 你持有的卡;命中的活動會加權(my_card_bonus)+ 前台可篩。
# 註:國泰 CUBE 卡本身是 Mastercard,故 Mastercard 專區你也用得到。
credit_cards:
  mine:
    - 國泰CUBE
    - 中信
    - Mastercard

# ── 分數三層門檻 ──
tiers:
  discover_min: 80
  maybe_min: 50
