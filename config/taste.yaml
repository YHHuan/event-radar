# Event Radar taste model
#
# Categories answer "what is it?". Facets answer "why is it worth leaving home?".
# Facets are scored at most once each so verbose listings cannot inflate relevance.

revision: "2026-08-30-v3"
model_score_max_age_days: 21
primary_cities: ["台北市", "新北市"]
nearby_cities: ["桃園市", "基隆市"]
destination_cities: ["台中市", "新竹市", "宜蘭縣"]

observed_examples:
  - title: "台北蚤之市"
    signals: [wander, place, limited, scene]
    note: "不是泛市集；是老物文化、城市場域與偶遇感。"
  - title: "驫舞20《大群舞》"
    signals: [embodied, live, curated, limited]
    note: "當代舞、現場演奏與二十周年脈絡。"
  - title: "2026臺北爵士音樂節"
    signals: [live, curated, place, scene]
    note: "整座城市、多場域與音樂節脈絡。"
  - title: "文化空總 晴空祭"
    signals: [place, curated, wander]
    note: "場域本身和節目同樣重要。"
  - title: "《人間樂園》"
    signals: [embodied, curated, limited]
    note: "有明確創作觀點、跨戲劇音樂肢體與大型裝置。"
  - title: "SoulFa 靈魂沙發《失望的山》"
    signals: [live, scene, limited]
    note: "有個性的樂團專場，不是泛大型演唱會。"
  - title: "JAM JAM ASIA"
    signals: [live, curated, wander, scene]
    note: "多舞台、跨國場景與可自由探索的節慶。"
  - title: "狂舞影展"
    signals: [curated, embodied, scene]
    note: "主題影展加映後交流，而非單一商業片。"
  - title: "台北城市狩獵"
    signals: [nature, place, participatory]
    note: "成人夜間生態觀察、實際進入城市自然。"
  - title: "雲門戶外公演"
    signals: [embodied, live, place, limited]
    note: "戶外場域和集體現場感。"

